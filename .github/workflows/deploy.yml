name: Build and deploy academic website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Main branch commit or ref to deploy
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        description: Main branch commit or ref to deploy after a data refresh
        required: false
        default: main
        type: string

# Each job requests only its own permissions. Builds cannot publish or push.
permissions: {}

# Serialize main builds and deployments, including calls from the metrics job.
# Pull requests have distinct refs and never enter the deployment job.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require deployed revision to belong to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check code and types
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'MMR000/MMR000.github.io'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'MMR000/MMR000.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
