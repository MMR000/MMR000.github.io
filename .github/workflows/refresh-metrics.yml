name: Refresh academic metrics

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-metrics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'MMR000/mamyraltaibek.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh authorized sources
        id: refresh
        run: node scripts/update-metrics.mjs
        env:
          OPENALEX_METRICS_ENABLED: ${{ vars.OPENALEX_METRICS_ENABLED }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SCOPUS_METRICS_ENABLED: ${{ vars.SCOPUS_METRICS_ENABLED }}
          SCOPUS_PUBLIC_DISPLAY_ALLOWED: ${{ vars.SCOPUS_PUBLIC_DISPLAY_ALLOWED }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          WOS_METRICS_ENABLED: ${{ vars.WOS_METRICS_ENABLED }}
          WOS_PUBLIC_DISPLAY_ALLOWED: ${{ vars.WOS_PUBLIC_DISPLAY_ALLOWED }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
      - name: Validate site before committing
        if: steps.refresh.outputs.changed == 'true'
        run: |
          npm test
          npm run lint
          npm run build
      - name: Commit validated source snapshots
        id: commit
        if: steps.refresh.outputs.changed == 'true'
        run: |
          if git diff --quiet -- data/metrics.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/metrics.json
          git commit -m 'Update authorized academic metrics'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
